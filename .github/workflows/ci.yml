name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch behave-rv releases breaking the skill

jobs:
  e2e:
    name: templates + gates vs published behave-rv (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the real published package
        run: python -m pip install behave-rv
      - name: End-to-end skill mechanics
        run: bash test/e2e.sh
      - name: The agent-built demo projects' gates hold
        run: |
          set -e
          for d in demo/*/; do
            [ -d "${d}monitoring" ] || continue
            echo "== ${d}"
            (cd "$d" && python monitoring/replay_check.py > /dev/null)
            # the app-surface files are exactly the modules the committed
            # catalog fingerprinted -- derive them so the check is self-describing
            apps=$(cd "$d" && python -c "import json;c=json.load(open('monitoring/catalog.json'));print(' '.join('app/%s.py'%m for m in sorted({s['module'] for s in c['app_surface']})))")
            trace=$(cd "$d" && ls monitoring/traces/*.jsonl | head -1)
            (cd "$d" && python -m behave_rv catalog diff \
              --steps monitoring/steps.py --catalog monitoring/catalog.json \
              --policies monitoring/policies --app $apps \
              --fail-on-app-risk --trace "$trace" > /dev/null)
            echo "   gates green"
          done

  skill-format:
    name: skill format checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: SKILL.md frontmatter and reference links resolve
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          skill = Path("skills/rv/SKILL.md").read_text()
          head = re.match(r"---\n(.*?)\n---\n", skill, re.S)
          assert head, "missing frontmatter"
          assert re.search(r"^name: rv$", head.group(1), re.M)
          assert re.search(r"^description: .{50,}", head.group(1), re.M)
          for link in re.findall(r"\]\((references/[^)]+)\)", skill):
              assert (Path("skills/rv") / link).exists(), link
          print("skill format OK;",
                len(set(re.findall(r'\]\(references/[^)]+\)', skill))),
                "reference links resolve")
          EOF
      - name: Plugin manifests are valid and consistent
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          assert plugin["name"] == "rv-monitoring"
          assert plugin["description"]
          assert market["owner"]["name"]
          entries = {p["name"]: p for p in market["plugins"]}
          assert "rv-monitoring" in entries
          assert entries["rv-monitoring"]["source"] == "./"
          assert Path("skills/rv/SKILL.md").exists()
          assert Path("skills/rv/templates/monitoring/steps.py").exists()
          print("plugin manifests OK")
          EOF
